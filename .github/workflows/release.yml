name: Release

# Pushing a tag vX.Y.Z publishes that version: npm through trusted publishing
# (GitHub's OIDC identity, no stored token, with provenance), then a GitHub
# release with the Claude Desktop bundle. See docs/rilascio.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # npm's trusted-publisher link names this environment, so no other job can publish.
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      # Includes the test that keeps package.json, manifest.json, plugin.json and the README in step.
      - run: npm test

      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm 11.5.1 or later is required for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"

      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "banca-dati-merito-mcp@$version" version >/dev/null 2>&1; then
            echo "banca-dati-merito-mcp@$version is already on npm: skipping (re-run of a partly failed release)"
          else
            npm publish --access public --provenance
          fi

      - name: Build the Claude Desktop bundle
        run: ./scripts/pack-mcpb.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bundle="banca-dati-merito-mcp-${TAG#v}.mcpb"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$bundle" --clobber
          else
            gh release create "$TAG" "$bundle" --verify-tag --generate-notes --title "$TAG"
          fi
